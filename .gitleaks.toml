# gitleaks configuration: the default rules, plus buildIt.Social personal
# access tokens ("buildit_pat_" followed by about 49 letters and digits) and
# agent session tokens ("buildit_ags_" followed by 49).
# The pre-commit hook in .githooks/ runs gitleaks with this file.

[extend]
useDefault = true

[[rules]]
id = "buildit-personal-access-token"
description = "buildIt.Social personal access token"
regex = '''\bbuildit_pat_[A-Za-z0-9]{40,64}\b'''
keywords = ["buildit_pat_"]

[[rules]]
id = "buildit-agent-session-token"
description = "buildIt.Social agent session token"
regex = '''buildit_ags_[0-9A-Za-z]{49}'''
keywords = ["buildit_ags_"]

  # The format's public test vectors (the agent API's contract shows one).
  # They never authenticate anything.
  [[rules.allowlists]]
  description = "Public test vectors of the session token format"
  regexTarget = "match"
  regexes = [
    '''^buildit_ags_003aUlTJC7tjlCTQj2uNU3MFagCXG9LRKRcwGkBIDlf3EfgbN$''',
    '''^buildit_ags_yhjskwdA6OZ1AL1YmHWZWm8LLG7HjnuCA2j5rOw8Xp114zifR$''',
    '''^buildit_ags_00000000000000000000000000000000000000000003O9xIA$''',
  ]
